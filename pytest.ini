[pytest]
# ===================== 核心配置 =====================
# 测试用例目录（你的用例在 testcases 文件夹）
testpaths = testcases

# 用例识别规则（不用改）
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ===================== 自动运行参数 =====================
# 自动带Allure报告参数，不用你手动敲命令
addopts = -v --alluredir=allure-results --clean-alluredir

# ===================== 注册你的环境标记（必加！） =====================
# 你之前 environment.py 里的 run_mark
markers =
    test_run: 测试环境用例
    beta_run: 预发环境用例
    prod_run: 生产环境用例