# 注册测试用例
testcases:
  - name: "注册成功-新用户1"
    username: "test_reg_001"
    password: "password123"
    expected:
      code: 200
      msg: "注册成功"

  - name: "注册成功-新用户2"
    username: "test_reg_002"
    password: "password123"
    expected:
      code: 200
      msg: "注册成功"

  - name: "注册失败-用户名为空"
    username: ""
    password: "password123"
    expected:
      code: 400
      error: "用户名和密码不能为空"

  - name: "注册失败-密码为空"
    username: "test_reg_003"
    password: ""
    expected:
      code: 400
      error: "用户名和密码不能为空"
