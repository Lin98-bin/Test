# order_create 测试用例
testcases:
- name: 商品不存在
  scenario: error
  data:
    goods_id: 99999
    quantity: 1
  expected:
    code: 404
- name: 多数量下单
  scenario: success
  data:
    goods_id: 3
    quantity: 3
  expected:
    code: 200
- name: 正常下单
  scenario: success
  data:
    goods_id: 1
    quantity: 1
  expected:
    code: 200
